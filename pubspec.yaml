name: amitabha
description: "念佛 — 以語音辨識自動計數佛號的專注念佛 App。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0

environment:
  sdk: ^3.9.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter 
  
  sherpa_onnx: ^1.10.45
  record: ^6.1.0           
  archive: ^4.0.3          
  http: ^1.3.0             
  path_provider: ^2.1.3    
  path: ^1.9.0

  provider: ^6.1.2         

  intl: ^0.20.2

  permission_handler: ^12.0.1

  wakelock_plus: ^1.2.8

  video_player: ^2.9.0
  cached_network_image: ^3.4.1

  in_app_review: ^2.0.10
  share_plus: ^10.1.4

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  flutter_lints: ^5.0.0
  flutter_flavorizr: 2.4.1
  flutter_launcher_icons: ^0.14.4
  

flavorizr:
  app:
    android:
      flavorDimensions: "app"   
    ios:
      buildConfiguration: "Release"  
  flavors:
    dev:
      app:
        name: "念佛 Dev"
      android:
        applicationId: "com.earth.amitabha.dev"
      ios:
        bundleId: "com.earth.amitabha.dev"

    staging:
      app:
        name: "念佛 Staging"
      android:
        applicationId: "com.earth.amitabha.staging"
      ios:
        bundleId: "com.earth.amitabha.staging"

    prod:
      app:
        name: "念佛"
      android:
        applicationId: "com.earth.amitabha"
      ios:
        bundleId: "com.earth.amitabha"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  generate: true 

  assets:
    - assets/hotwords.txt
    - assets/images/amitabha_calligraphy.png
    - assets/images/amitabha_calligraphy_ja.png
    - assets/images/amitabha_calligraphy_sa.png
    - assets/images/amitabha_calligraphy_vi.png
    - assets/images/amitabha_calligraphy_ko.png
    # 念佛頁按鈕標題書法圖（白字透明底，執行時染色）；逐語系一目錄。
    - assets/images/chant_buttons/zh/
    - assets/images/chant_buttons/ja/
    - assets/images/chant_buttons/ko/
    - assets/images/chant_buttons/vi/
    - assets/images/chant_buttons/en/
    - assets/images/chant_buttons/de/
    - assets/images/chant_buttons/fr/
    - assets/videos/bg_mountain_stream.mp4
    - assets/images/bg_mountain_stream.png
    - assets/images/bg_bodhi_leaf.png
    # 平板專用：3:4 畫布背景 + 全螢幕鋪底（cover）。
    - assets/images/bg_bodhi_leaf_tablet.png
    - assets/images/bg_bodhi_leaf_bleed.png
    - assets/images/settings_titles/zh/
    - assets/images/settings_titles/en/
    - assets/images/settings_titles/ja/
    - assets/images/settings_titles/ko/
    - assets/images/settings_titles/vi/
    - assets/images/settings_titles/de/
    - assets/images/settings_titles/fr/
    - assets/gifs/lotus_flower.webp
    - assets/images/lotus_divider.png
    - assets/sherpa-onnx/encoder.int8.onnx
    - assets/sherpa-onnx/decoder.onnx
    - assets/sherpa-onnx/joiner.int8.onnx
    - assets/sherpa-onnx/tokens.txt
    - assets/sherpa-onnx/bpe.vocab
    - assets/announcements/
    - assets/announcements/dev-intro/
    - assets/announcements/changelog/
    - assets/announcements/licenses/

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    # 思源宋體 繁中完整字（Noto Serif TC ExtraLight，OFL，全 ~20,000 字）；纖細明體。
    # 同時供「迴向偈顯示」與「編輯迴向偈自由輸入」用——原顯示的 Gatha 子集即此字重
    # 的子集，改用完整檔後合併為一，顯示外觀不變、編輯亦纖細且不缺字。
    - family: NotoSerifTC
      fonts:
        - asset: assets/fonts/NotoSerifTC-ExtraLight.ttf
    # 日文明體（常用漢字 + 假名 + 偈文），日文改用日文字形。
    - family: NotoSerifGathaJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Gatha.ttf
    # 韓文諺文明體（Noto Serif KR ExtraLight，實例化＋子集化為 KS X 1001 常用
    # 2,350 音節，涵蓋日常韓文；罕見音節落系統字）。韓文迴向偈主字型、他語系諺文
    # fallback。漢字仍由 TC / LXGW 承接。
    - family: NotoSerifGathaKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-ExtraLight.ttf
    # 霞鶩文楷 TC LXGW WenKai TC（lxgw/LxgwWenkaiTC，OFL）；
    # 記錄頁/設定頁的繁體字 fallback（Klee One 為日文字體，缺字時落回此楷體）。
    - family: LxgwWenkaiTC
      fonts:
        - asset: assets/fonts/LXGWWenKaiTC-Regular.ttf
    # Klee One（googlefonts/klee，OFL）；記錄頁/設定頁主字體，手寫楷書風。
    # 日文字體，繁體缺字由 LxgwWenkaiTC fallback 補上。
    # 記錄/念佛頁主字體，手寫楷書風。已依實際使用字集子集化（原檔約 8MB → ~1MB）；
    # 未收錄的冷僻字由 LxgwWenkaiTC fallback 承接。
    - family: KleeOne
      fonts:
        - asset: assets/fonts/KleeOne-Regular.ttf
        - asset: assets/fonts/KleeOne-SemiBold.ttf
          weight: 600

  # To add assets to your application, add an assets section, like this:
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package


flutter_launcher_icons:
  # 頂層一定要宣告平台
  android: "app"   # 你的 Android module 名稱
  ios: true
  remove_alpha_ios: true
  remove_existing: true

  # 為了通過舊版驗證，給一個備用圖（實際會被 flavor 覆蓋）
  image_path: assets/icons/prod_ios.png
  adaptive_icon_foreground: assets/icons/prod_android_fg.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_monochrome: assets/icons/prod_android_mono.png

  flavors:
    dev:
      ios: true
      android: "app"
      image_path_ios: assets/icons/dev_ios.png
      adaptive_icon_foreground: assets/icons/dev_android_fg.png
      adaptive_icon_background: "#FFFFFF"
      adaptive_icon_monochrome: assets/icons/dev_android_mono.png

    staging:
      ios: true
      android: "app"
      image_path_ios: assets/icons/staging_ios.png
      adaptive_icon_foreground: assets/icons/staging_android_fg.png
      adaptive_icon_background: "#FFFFFF"
      adaptive_icon_monochrome: assets/icons/staging_android_mono.png

    prod:
      ios: true
      android: "app"
      image_path_ios: assets/icons/prod_ios.png
      adaptive_icon_foreground: assets/icons/prod_android_fg.png
      adaptive_icon_background: "#FFFFFF"
      adaptive_icon_monochrome: assets/icons/prod_android_mono.png