name: amitabha
description: "好好念佛 — 以語音辨識自動計數佛號的App。"
publish_to: 'none'

version: 2.0.0+16

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter 
  
  sherpa_onnx: ^1.10.45
  record: ^6.1.0           
  archive: ^4.0.3          
  http: ^1.3.0             
  path_provider: ^2.1.3    
  path: ^1.9.0

  provider: ^6.1.2         

  intl: ^0.20.2

  permission_handler: ^12.0.1

  wakelock_plus: ^1.2.8

  video_player: ^2.9.0
  cached_network_image: ^3.4.1

  in_app_review: ^2.0.10
  share_plus: ^10.1.4

  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  flutter_lints: ^5.0.0
  flutter_flavorizr: 2.4.1
  flutter_launcher_icons: ^0.14.4
  
flavorizr:
  app:
    android:
      flavorDimensions: "app"   
    ios:
      buildConfiguration: "Release"  
  flavors:
    dev:
      app:
        name: "念佛 Dev"
      android:
        applicationId: "com.earth.amitabha.dev"
      ios:
        bundleId: "com.earth.amitabha.dev"

    staging:
      app:
        name: "念佛 Staging"
      android:
        applicationId: "com.earth.amitabha.staging"
      ios:
        bundleId: "com.earth.amitabha.staging"

    prod:
      app:
        name: "念佛"
      android:
        applicationId: "com.earth.amitabha"
      ios:
        bundleId: "com.earth.amitabha"

flutter:
  generate: true 

  assets:
    - assets/branding/app_icon.png
    - assets/branding/calligraphy/

    - assets/backgrounds/bodhi_leaf/
    - assets/backgrounds/mountain_stream/

    - assets/ui/chant_buttons/zh/
    - assets/ui/chant_buttons/ja/
    - assets/ui/chant_buttons/ko/
    - assets/ui/chant_buttons/vi/
    - assets/ui/chant_buttons/en/
    - assets/ui/chant_buttons/de/
    - assets/ui/chant_buttons/fr/
    - assets/ui/settings_titles/zh/
    - assets/ui/settings_titles/en/
    - assets/ui/settings_titles/ja/
    - assets/ui/settings_titles/ko/
    - assets/ui/settings_titles/vi/
    - assets/ui/settings_titles/de/
    - assets/ui/settings_titles/fr/
    - assets/ui/decorations/

    - assets/content/announcements/
    - assets/content/announcements/dev-intro/
    - assets/content/announcements/changelog/
    - assets/content/announcements/licenses/

    - assets/ml/asr/encoder.int8.onnx
    - assets/ml/asr/decoder.onnx
    - assets/ml/asr/joiner.int8.onnx
    - assets/ml/asr/tokens.txt
    - assets/ml/asr/bpe.vocab
    - assets/ml/asr/hotwords.txt

  uses-material-design: true

  fonts:
    - family: NotoSerifTC
      fonts:
        - asset: assets/fonts/NotoSerifTC-ExtraLight.ttf
    - family: NotoSerifGathaJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Gatha.ttf
    - family: NotoSerifGathaKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-ExtraLight.ttf
    - family: LxgwWenkaiTC
      fonts:
        - asset: assets/fonts/LXGWWenKaiTC-Regular.ttf
    - family: KleeOne
      fonts:
        - asset: assets/fonts/KleeOne-Regular.ttf
        - asset: assets/fonts/KleeOne-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: "app"
  ios: true
  remove_alpha_ios: true
  remove_existing: true

  image_path: tool/launcher_icons/prod_ios.png
  adaptive_icon_foreground: tool/launcher_icons/prod_android_fg.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_monochrome: tool/launcher_icons/prod_android_mono.png

  flavors:
    dev:
      ios: true
      android: "app"
      image_path_ios: tool/launcher_icons/dev_ios.png
      adaptive_icon_foreground: tool/launcher_icons/dev_android_fg.png
      adaptive_icon_background: "#FFFFFF"
      adaptive_icon_monochrome: tool/launcher_icons/dev_android_mono.png

    staging:
      ios: true
      android: "app"
      image_path_ios: tool/launcher_icons/staging_ios.png
      adaptive_icon_foreground: tool/launcher_icons/staging_android_fg.png
      adaptive_icon_background: "#FFFFFF"
      adaptive_icon_monochrome: tool/launcher_icons/staging_android_mono.png

    prod:
      ios: true
      android: "app"
      image_path_ios: tool/launcher_icons/prod_ios.png
      adaptive_icon_foreground: tool/launcher_icons/prod_android_fg.png
      adaptive_icon_background: "#FFFFFF"
      adaptive_icon_monochrome: tool/launcher_icons/prod_android_mono.png
